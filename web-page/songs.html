<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clobster OS | Audio Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2fe;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --bg: rgb(10, 112, 114);
        }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .nav-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 2px solid rgba(200, 200, 200, 0.8);
        }

        .logo { font-weight: 600; letter-spacing: 4px; color: var(--accent); font-size: 2rem; }
        .nav-links { display: flex; gap: 10px; }

        .nav-links a {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid rgba(200, 200, 200, 0.8);
            padding: 5px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
        }
        .nav-links a:hover {
            /* Al pasar el mouse, el borde "se enciende" con el color del logo */
            border-color: var(--accent);
            color: var(--accent);

            background: rgba(0, 242, 254, 0.1); /* Brillo interno muy suave */
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); /* Efecto de resplandor neón */

            transform: translateY(-2px); /* Pequeña elevación para dar feedback */
        }

        .main-container { flex: 1; display: flex; overflow: hidden; }
        .panel { flex: 1; padding: 25px; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }

	.panel-center { 
	    flex: 1.2; 
	    display: flex; 
	    flex-direction: column; 
	    gap: 20px; 
	    padding: 20px; 
	    overflow-y: auto; 
	}

	.preview-container {
	    width: 400px;
	    height: 320px;
	    margin: 0 auto;
	    background: rgba(0,0,0,0.4);
	    border-radius: 20px;
	    border: 1px dashed var(--accent);
	    display: flex;
	    flex-direction: column;
	    align-items: center;
	    justify-content: center;
	    gap: 10px;
	}

	#main-audio {
	    width: 90%;
	    height: 45px;
	    pointer-events: auto;
	    display: none; /* Se activa al clickear una canción */
	}

	.file-link {
	    color: white;
	    text-decoration: none;
	    cursor: pointer;
	    transition: 0.2s;
	}

	.file-link:hover {
	    color: var(--accent);
	    text-shadow: 0 0 8px var(--accent);
	}
        
        .panel-tools { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 10px 15px; border-radius: 12px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); }

        /* Fila seleccionada */
        .selected-row {
            background: rgba(0, 242, 254, 0.15) !important;
            border-left: 3px solid var(--accent);
        }

        /* Animación sutil para el long-press */
        .pressing {
            background: rgba(255, 255, 255, 0.05);
            transition: background 1s linear;
        }

        /* Estilo para los checkboxes en modo selección */
        .file-check {
            transform: scale(1.2);
            cursor: pointer;
        }

        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; width: 100%; box-sizing: border-box; }
        .scroll { flex: 1; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-action { background: var(--accent); color: black; border: none; padding: 15px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .btn-action:hover { box-shadow: 0 0 20px var(--accent); transform: scale(1.02); }
        .batch-tag { color: var(--accent); font-size: 0.7rem; font-weight: 600; margin-top: 15px; display: block; border-left: 2px solid var(--accent); padding-left: 10px; }
        .mini-select { background-color: var(--bg); color: white; border: 1px solid var(--accent); font-size: 0.75rem; outline: none; cursor: pointer; }
        input[type="checkbox"] { cursor: pointer; accent-color: var(--accent); }

        /* Botón de Sincronización */
        .btn-sync {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-sync:hover { background: var(--accent); color: black; }
    </style>
</head>
<body>

    <nav class="nav-container">
        <div class="logo" style="color: rgba(0, 255, 255, 1.0;">C-OS | Motor de Audio</div>
        <div class="nav-links">
            <a href="/convert/index">Inicio</a>
            <a href="/convert/images">Imágenes</a>
            <a href="/convert/videos">Videos</a>
            <a href="/convert/autotaskQueue">Tareas Automaticas</a>
            <a href="/convert/mixedjob">Tareas Mixtas</a>
            <a href="/convert/logs">Registros</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0">🎵 Biblioteca</h3>
                <button onclick="syncDatabase()" class="btn-sync">🔄 Sincronizar Disco</button>
            </div>

            <div class="panel-tools">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="master-select" onclick="toggleAll(this)">
                    <label for="master-select" style="font-size: 0.75rem; opacity: 0.8; cursor:pointer;">Seleccionar todo</label>
                </div>
                <select id="sort-order" class="mini-select" onchange="loadRaw()">
                    <option value="asc">Nombre A-Z</option>
                    <option value="desc">Nombre Z-A</option>
                </select>
            </div>
            <div class="scroll">
                <table><tbody id="raw-body"></tbody></table>
            </div>
        </div>

        <div class="panel-center">
	    <div class="preview-container">
	        <p id="placeholder-text" style="opacity:0.3; margin:0;">Selecciona un FLAC o un resultado para escuchar</p>
	        <div id="audio-info" style="display:none; font-size:0.8rem; color:var(--accent); margin-bottom:5px; letter-spacing:1px;">REPRODUCIENDO...</div>
		<audio id="main-audio" controls controlsList="nodownload noplaybackrate"></audio>
		<img id="audio-cover" src="" style="display: none; width: 200px; height: 200px; object-fit: cover;">
	        <audio id="main-audio" controls>
	            Tu navegador no soporta el reproductor de audio.
	        </audio>
	    </div>
	    <div class="glass-card" style="max-width: 100%;">
	        <h2 style="margin-top:0">🎵 Hi-Res Audio Engine</h2>
	        <p style="opacity:0.5; font-size: 0.8rem;">Formato de salida:</p>
	        
	        <select id="action-select" class="btn-action" style="appearance:none; text-align:center; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--accent); outline:none;">
                    <optgroup label="Popular & Móvil" style="background: #1a1c23;">
                        <option value="audio_mp3_320">MP3 - 320kbps (HQ)</option>
                        <option value="audio_mp3_128">MP3 - 128kbps (Lite)</option>
                        <option value="audio_aac">AAC (Standard)</option>
                        <option value="audio_m4a">M4A (Apple)</option>
                    </optgroup>
                    <optgroup label="Modernos & HQ" style="background: #1a1c23;">
                        <option value="audio_ogg">OGG Vorbis</option>
                        <option value="audio_opus">Opus (HQ-Low size)</option>
                        <option value="audio_flac">FLAC (Lossless)</option>
                        <option value="audio_aiff">AIFF (Apple HQ)</option>
                        <option value="audio_hires_sim">LDAC / Hi-Res (96k/24b)</option>
                    </optgroup>
                    <optgroup label="Legacy" style="background: #1a1c23;">
                        <option value="audio_amr">AMR (Voice)</option>
                    </optgroup>
	        </select>

	        <button class="btn-action" onclick="processBatch()">🚀 PROCESAR AUDIO</button>
	    </div>
	</div>
        <div class="panel">
            <h3>✅Resultados</h3>
            <div class="scroll" id="out-body"></div>
        </div>
    </div>

<script>
    // Sincronizar el selector de navegación con la URL
    window.addEventListener('pageshow', () => {
        const selector = document.getElementById('nav-selector');
        const currentPath = window.location.pathname;
        for (let option of selector.options) {
            if (option.value === currentPath) { option.selected = true; break; }
        }
    });

    /**
     * Sincronización manual: Obliga al Master a escanear el disco
     */
    async function syncDatabase() {
        const btn = document.querySelector('.btn-sync');
        btn.innerText = "⏳ Sincronizando...";
        btn.disabled = true;

        try {
            const res = await fetch('/dataset/sync', { method: 'POST' });
            const data = await res.json();
            
            if (data.status === 'success') {
                await loadRaw(); // Recarga la lista desde la DB ya limpia
                alert("Sincronización completa. La biblioteca se ha actualizado.");
            }
        } catch (error) {
            console.error("Error de red:", error);
            alert("No se pudo conectar con el Master para sincronizar.");
        } finally {
            btn.innerText = "🔄 Sincronizar Disco";
            btn.disabled = false;
        }
    }

    function toggleAll(master) {
        document.querySelectorAll('.file-check').forEach(c => c.checked = master.checked);
    }

    let longPressTimer;
    let multiSelectMode = false;
    let isLongPressActive = false;

    function checkMultiSelectState() {
        const totalSelected = document.querySelectorAll('.file-check:checked').length;
        if (totalSelected === 0) {
            multiSelectMode = false;
        } else if (totalSelected > 1) {
            multiSelectMode = true; // Se asegura de que se active al pasar de 1
        }
    }

    // Función para limpiar todas las selecciones
    function clearAllSelections() {
        document.querySelectorAll('.file-check').forEach(cb => cb.checked = false);
        document.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected-row'));
    }

    // Función central de selección
    function selectFile(row, checkbox, isLongPress) {
        if (isLongPress) {
            checkbox.checked = true;
            row.classList.add('selected-row');
        } else {
            if (!multiSelectMode) {
                clearAllSelections();
                checkbox.checked = true;
            } else {
                checkbox.checked = !checkbox.checked; // En modo múltiple, el clic corto también hace toggle
            }
        }

        // Feedback visual de la fila
        if (checkbox.checked) row.classList.add('selected-row');
        else row.classList.remove('selected-row');

        // Si no hay nada seleccionado, desactivamos el modo múltiple
        const totalSelected = document.querySelectorAll('.file-check:checked').length;
        if (totalSelected === 0) multiSelectMode = false;
    }

    async function loadRaw() {
        try {
            const res = await fetch('/dataset/raw/songs');
            const data = await res.json();
            const sortOrder = document.getElementById('sort-order').value;
            const body = document.getElementById('raw-body');
            
            if (!data.files || data.files.length === 0) {
                body.innerHTML = '<tr><td style="opacity:0.3; text-align:center; padding:20px;">Biblioteca vacía.</td></tr>';
                return;
            }

            data.files.sort((a, b) => sortOrder === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
            body.innerHTML = data.files.map(f => `
                <tr onmousedown="startPress(this)"
                    onmouseup="endPress(this, 'ROW/SONGS/${f.name}')"
                    onmouseleave="cancelPress(this)"
                    ontouchstart="startPress(this)"
                    ontouchend="endPress(this, 'ROW/SONGS/${f.name}')"
                    style="cursor: pointer; transition: 0.2s;">
		    <td width="30">
			<input type="checkbox" class="file-check" data-path="${f.path}"onclick="event.stopPropagation()">
		    </td>
		    <td>
			<span class="file-link">${f.name}</span>
			<br><small style="opacity:0.4; font-size:0.7rem;">${f.size}</small>
		    </td>
                </tr>
            `).join('');
            document.getElementById('master-select').checked = false;
        } catch (e) { console.error("Error cargando canciones:", e); }
    }
    async function loadOut() {
        try {
            const res = await fetch('/dataset/out/songs');
            const data = await res.json();
            const body = document.getElementById('out-body');
            body.innerHTML = '';
            Object.entries(data.structure).sort().reverse().forEach(([folder, files]) => {
                body.innerHTML += `<span class="batch-tag">🕒 ${folder}</span>`;
                files.forEach(f => {
                    const resultPath = `out/songs/${folder}/${f}`;
                    body.innerHTML += `
                        <div style="font-size:0.75rem; padding: 5px 15px; opacity:0.6; border-bottom: 1px solid rgba(255,255,255,0.02);">
                            📄 <a class="file-link" onclick="updatePreview('${resultPath}')">${f}</a>
                        </div>`;
                });
            });
        } catch (e) { console.error("Error en salidas:", e); }
    }

    async function processBatch() {
        const action = document.getElementById('action-select').value;
        const selected = document.querySelectorAll('.file-check:checked');
        if (selected.length === 0) return alert("Selecciona canciones.");

	const batchId = new Date().toLocaleString('es-CR', { hour12: false }).replace(/[/, :]/g, '-').replace(/ /g, '_').slice(0, 16);        

        for (const check of selected) {
            await fetch('/enqueue', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename: check.getAttribute('data-path'), action: action, batch_id: batchId })
            });
        }
        alert(`Lote "${batchId}" encolado con éxito.`);
        document.querySelectorAll('.file-check').forEach(c => c.checked = false);
        document.getElementById('master-select').checked = false;
        loadOut();
    }

    function updatePreview(path) {
        const audio = document.getElementById('main-audio');
	const cover = document.getElementById('audio-cover'); // Nueva referencia
        const placeholder = document.getElementById('placeholder-text');
        const info = document.getElementById('audio-info');

        audio.src = `/media/${path}`;
	audio.volume = 0.15;

	const fileName = path.split('/').pop().split('.').slice(0, -1).join('.');
	cover.src = `/media/ROW/SONGS/Caratulas/${fileName}.png`;
	cover.onerror = () => { cover.src = '/media/ROW/SONGS/Caratulas/default.jpg'; };
        cover.style.display = 'block';

        audio.style.display = 'block';
        placeholder.style.display = 'none';
        info.style.display = 'block';
        info.innerText = `REPRODUCIENDO: ${path.split('/').pop()}`;
        //audio.play().catch(e => console.log("Interacción requerida para audio"));
    }

    function startPress(row) {
        isLongPressActive = false; // Resetear al iniciar
        row.classList.add('pressing');

        longPressTimer = setTimeout(() => {
            isLongPressActive = true; // Bloqueamos el clic corto posterior
            multiSelectMode = true;   // Activamos modo múltiple

            const checkbox = row.querySelector('.file-check');
            selectFile(row, checkbox, true);

            row.classList.remove('pressing');
            if (navigator.vibrate) navigator.vibrate(60); // Feedback táctil
        }, 800); // Bajé a 800ms para que se sienta más responsivo
    }

    function endPress(row, path) {
        clearTimeout(longPressTimer);
        row.classList.remove('pressing');

        // SI NO fue un clic largo, procesamos como clic normal
        if (!isLongPressActive) {
            const checkbox = row.querySelector('.file-check');

            if (!multiSelectMode) {
                // En modo normal: Previsualiza y selecciona solo uno
                updatePreview(path);
                clearAllSelections();
                checkbox.checked = true;
                row.classList.add('selected-row');
            } else {
                // En modo múltiple: Solo hace toggle
                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) row.classList.add('selected-row');
                else row.classList.remove('selected-row');
            }
        }

        // Verificamos si aún quedan elementos seleccionados para mantener el modo
        checkMultiSelectState();

        isLongPressActive = false; // Liberamos para el siguiente archivo
    }

    function cancelPress(row) {
        clearTimeout(longPressTimer);
        row.classList.remove('pressing');
    }

    window.onload = () => { loadRaw(); loadOut(); setInterval(loadOut, 10000); };
</script>
</body>
</html>
